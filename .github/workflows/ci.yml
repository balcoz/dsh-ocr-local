name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (JS)
        run: |
          node --check dsh/index.js
          node --check dsh/client.js
          node --check patch/apply-cc-tui-patch.mjs
          node --check patch/apply-wt-key.mjs

      - name: Python syntax check
        run: |
          python3 -m py_compile ocr/ocr.py ocr/download_models.py

      - name: Package validation (npm pack dry-run)
        run: |
          npm pack --dry-run
          test -f package.json
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) { console.error('missing dsh.bundle manifest'); process.exit(1) }; console.log('dsh.bundle OK:', p.dsh.bundle.patch)"

      - name: Patch scripts dry-run (idempotent, no writes)
        run: |
          node patch/apply-wt-key.mjs --key ctrl+v --dry-run >/dev/null && echo "apply-wt-key dry-run OK"
